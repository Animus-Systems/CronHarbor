apiVersion: cronharbor.dev/v1
kind: OneShotJob
metadata:
  name: isolated-container
  namespace: local
spec:
  owner: file
  enabled: true
  execution:
    adapter: docker
    command: /bin/echo
    args: ["Runs in an explicitly authorized sibling container"]
    workingDirectory: /tmp
    docker:
      image: alpine@sha256:bfe7ceb9f09ec0566c48fb93356e45a47a00be5a1dd14fa5b909e7709c66b034
      user: "10001:10001"
      network: none
      memoryBytes: 67108864
      pidsLimit: 32
  timeoutSeconds: 30
  logs:
    maxRunBytes: 1048576
